name: Compile Arduino Sketch for Portenta H7

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
    
    - name: Install Arduino Mbed OS Portenta Boards
      run: |
        arduino-cli core update-index
        arduino-cli core install arduino:mbed_portenta
    
    - name: Install required libraries
      run: |
        arduino-cli lib install "Adafruit NeoPixel"
        arduino-cli lib install "PubSubClient"
        arduino-cli lib install "DHT sensor library"
        arduino-cli lib install "Adafruit Unified Sensor"
        arduino-cli lib install "OneWire"
        arduino-cli lib install "DallasTemperature"
        arduino-cli lib install "NTPClient"
    
    - name: Compile sketch for Portenta H7
      env:
        WIFI_SSID_PRIMARY: ${{ secrets.WIFI_SSID_PRIMARY }}
        WIFI_SSID_FALLBACK: ${{ secrets.WIFI_SSID_FALLBACK }}
        WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
        MQTT_SERVER: ${{ secrets.MQTT_SERVER }}
        MQTT_USER: ${{ secrets.MQTT_USER }}
        MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      run: |
        arduino-cli compile \
          --fqbn arduino:mbed_portenta:envie_m7 \
          --output-dir ./build \
          --build-property "build.extra_flags=-DWIFI_SSID_PRIMARY=\"${WIFI_SSID_PRIMARY}\" -DWIFI_SSID_FALLBACK=\"${WIFI_SSID_FALLBACK}\" -DWIFI_PASSWORD=\"${WIFI_PASSWORD}\" -DMQTT_SERVER=\"${MQTT_SERVER}\" -DMQTT_USER=\"${MQTT_USER}\" -DMQTT_PASSWORD=\"${MQTT_PASSWORD}\""
    
    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        ls -lah ./build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: portenta-h7-stairs-firmware
        path: |
          ./build/**/*.bin
          ./build/**/*.elf
          ./build/**/*.hex
          PortentaH7_Stairs.ino
        retention-days: 10
    
    - name: Create release package
      run: |
        mkdir -p release
        cp README.md release/ 2>/dev/null || true
        cp WIRING_DIAGRAM.md release/ 2>/dev/null || true
        cp MQTT_EXAMPLES.md release/ 2>/dev/null || true
        if [ -d "./build" ]; then
          find ./build -name '*.ino.bin' -exec sh -c 'cp "$1" release/PortentaH7_Stairs.bin' _ {} \; 2>/dev/null || true
          find ./build -name '*.ino.hex' -exec sh -c 'cp "$1" release/PortentaH7_Stairs.hex' _ {} \; 2>/dev/null || true
        fi
        cp PortentaH7_Stairs.ino release/
        cd release
        zip -r ../PortentaH7_Stairs_Release.zip .
    
    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: portenta-h7-stairs-release-package
        path: PortentaH7_Stairs_Release.zip
        retention-days: 10
